<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} — {{end}}Argus</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <!-- Inline SVG Sprite -->
  <div style="display:none;">
    {{.IconsSVG}}
  </div>

  <header class="header">
    <div class="header__left">
      <a href="/" class="header__logo">
        <svg class="icon" style="width:20px;height:20px;"><use href="#icon-radar"></use></svg>
        <span>Argus</span>
      </a>
    </div>

    {{if not .HideSearch}}
    <div class="header__center">
      <div class="search-box">
        <svg class="icon"><use href="#icon-search"></use></svg>
        <input type="text" id="search-input" placeholder="Buscar sistemas... (pressione /)" autocomplete="off">
        <span class="kbd">/</span>
      </div>

      <div class="filter-chips">
        <button class="chip active" data-filter="all">Todos</button>
        <button class="chip" data-filter="down">Fora do ar</button>
        <button class="chip" data-filter="degraded">Instável</button>
        <button class="chip" data-filter="up">Operacional</button>
      </div>

      {{if .Groups}}
      <select id="group-filter" class="group-select" aria-label="Filtrar por grupo">
        <option value="all">Todos os grupos</option>
        {{range .Groups}}
          <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
      {{end}}
    </div>
    {{end}}

    <div class="header__right">
      <div class="live-indicator">
        <span class="live-dot" id="live-dot"></span>
        <span>Ao vivo</span>
      </div>

      {{if not .HideSearch}}
      <button class="btn-icon" id="view-toggle-btn" title="Alternar visualização Cards / Compacto" aria-label="Visualização compacta">
        <svg class="icon"><use href="#icon-list"></use></svg>
      </button>
      {{end}}

      <button class="btn-icon" id="sound-toggle-btn" title="Alerta sonoro (Silenciado)" aria-label="Alerta sonoro">
        <svg class="icon"><use href="#icon-bell-off"></use></svg>
      </button>

      <button class="btn-icon" id="tv-toggle-btn" title="Modo TV / Sala de Operações" aria-label="Modo TV">
        <svg class="icon"><use href="#icon-tv"></use></svg>
      </button>

      <button class="btn-icon" id="theme-toggle-btn" title="Alternar tema claro/escuro" aria-label="Alternar tema">
        <svg class="icon"><use href="#icon-moon"></use></svg>
      </button>
    </div>
  </header>

  {{template "content" .}}

</body>
</html>
