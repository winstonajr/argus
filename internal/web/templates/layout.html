<!DOCTYPE html>
<html lang="{{.T.Lang}}" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{if .Title}}{{.Title}} — {{end}}Argus</title>
  <link rel="icon" type="image/png" href="{{asset "favicon.png"}}">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="{{asset "apple-touch-icon.png"}}">
  <link rel="manifest" href="{{asset "manifest.json"}}">
  <meta name="theme-color" content="#0E131A">
  <script>
    (function() {
      var savedTheme = localStorage.getItem('argus-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (prefersDark ? 'dark' : 'light'));
      if (new URLSearchParams(window.location.search).get('view') === 'tv') {
        document.documentElement.classList.add('tv-mode');
      }
      if (localStorage.getItem('argus-view') === 'compact') {
        document.documentElement.classList.add('view-compact');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{asset "css/tokens.css"}}">
  <link rel="stylesheet" href="{{asset "css/app.css"}}">
  <script src="{{asset "vendor/htmx.min.js"}}"></script>
  <script src="{{asset "js/app.js"}}" defer></script>
</head>
<body data-lang="{{.T.Lang}}"
      data-tab-down-fmt="{{.T.TabSystemsDownFmt}}"
      data-tab-ok="{{.T.TabOperational}}"
      data-sound-active="{{.T.SoundActiveTitle}}"
      data-sound-muted="{{.T.SoundMutedTitle}}"
      data-sort-active="{{.T.SortActiveTitle}}"
      data-sort-priority="{{.T.SortPriorityTitle}}"
      data-no-response="{{.T.NoResponse}}"
      data-maint-enable="{{.T.EnableMaintenance}}"
      data-maint-disable="{{.T.DisableMaintenance}}"
      data-checking="{{.T.Checking}}"
      data-scheduled="{{.T.Scheduled}}"
      data-toast-test-sent="{{.T.ToastTestSentFmt}}"
      data-toast-test-failed="{{.T.ToastTestFailed}}"
      data-toast-maint-on="{{.T.ToastMaintEnabled}}"
      data-toast-maint-off="{{.T.ToastMaintDisabled}}"
      data-toast-check-done="{{.T.ToastCheckDone}}"
      data-toast-rate-limit="{{.T.ToastRateLimit}}">
  <div class="sr-sprite">
    {{.IconsSVG}}
  </div>

  <header class="header">
    <div class="header__left">
      <a href="/" class="header__logo">
        <img src="{{asset "favicon.png"}}" alt="Argus" class="header__logo-img" width="26" height="26">
        <span>Argus</span>
      </a>
    </div>

    {{if not .HideSearch}}
    <div class="header__center">
      <div class="search-box">
        <svg class="icon"><use href="#icon-search"></use></svg>
        <input type="text" id="search-input" placeholder="{{.T.SearchPlaceholder}}" autocomplete="off">
        <span class="kbd">/</span>
      </div>

      <div class="filter-chips">
        <button class="chip active" data-filter="all">{{.T.FilterAll}}</button>
        <button class="chip" data-filter="down">{{.T.FilterDown}}</button>
        <button class="chip" data-filter="degraded">{{.T.FilterDegraded}}</button>
        <button class="chip" data-filter="up">{{.T.FilterUp}}</button>
      </div>

      {{if .Groups}}
      <select id="group-filter" class="group-select" aria-label="{{.T.FilterByGroup}}">
        <option value="all">{{.T.AllGroups}}</option>
        {{range .Groups}}
          <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
      {{end}}
    </div>
    {{end}}

    <div class="header__right">
      <div class="live-indicator">
        <span class="live-dot" id="live-dot"></span>
        <span>{{.T.Live}}</span>
      </div>

      {{if not .HideSearch}}
      <button class="btn-icon" id="sort-toggle-btn" title="{{.T.SortPriorityTitle}}" aria-label="{{.T.SortPriorityTitle}}">
        <svg class="icon"><use href="#icon-sort"></use></svg>
      </button>

      <button class="btn-icon" id="view-toggle-btn" title="{{.T.ViewCompactTitle}}" aria-label="{{.T.ViewCompactTitle}}">
        <svg class="icon"><use href="#icon-list"></use></svg>
      </button>
      {{end}}

      <button class="btn-icon" id="sound-toggle-btn" title="{{.T.SoundMutedTitle}}" aria-label="{{.T.SoundMutedTitle}}">
        <svg class="icon"><use href="#icon-bell-off"></use></svg>
      </button>

      {{if not .HideSearch}}
      <button class="btn-icon" id="test-alert-btn" title="{{.T.TestAlertTitle}}" aria-label="{{.T.TestAlertTitle}}">
        <svg class="icon"><use href="#icon-send"></use></svg>
      </button>
      {{end}}

      <button class="btn-icon" id="tv-toggle-btn" title="{{.T.TVModeTitle}}" aria-label="{{.T.TVModeTitle}}">
        <svg class="icon"><use href="#icon-tv"></use></svg>
      </button>

      <button class="btn-icon" id="theme-toggle-btn" title="{{.T.ThemeToggleTitle}}" aria-label="{{.T.ThemeToggleTitle}}">
        <svg class="icon"><use href="#icon-moon"></use></svg>
      </button>
    </div>
  </header>

  {{template "content" .}}

</body>
</html>
