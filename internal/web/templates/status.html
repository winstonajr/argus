{{define "content"}}
<main class="main-container status-page-container" id="status-page">
  <div class="history-header">
    <div class="status-page-header">
      <div>
        <h1 class="history-title">{{.T.PublicStatusTitle}}</h1>
        <span class="mono text-muted text-xs">{{.T.UpdatedAt}} {{.LastCheckFormatted}}</span>
      </div>
      <span class="pill pill--{{.OverallStatusLower}} pill--lg">
        <span class="dot"></span>
        {{.OverallLabel}}
      </span>
    </div>
  </div>

  <section class="events-section">
    <div class="events-list">
      {{range .Systems}}
      <div class="event-item">
        <div class="event-item__body">
          <strong>{{.Name}}</strong>
          {{if .Group}}<span class="check-row__badge">{{.Group}}</span>{{end}}
        </div>
        <div class="status-page-item__right">
          <span class="mono text-muted text-xs">1h: {{printf "%.1f%%" .Uptime1h}}</span>
          <span class="pill pill--{{.StatusLower}}">
            <span class="dot"></span>
            {{.StatusLabel}}
          </span>
        </div>
      </div>
      {{end}}
    </div>
  </section>
</main>
{{end}}
