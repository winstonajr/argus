<div class="stats-bar">
  <div class="stats-grid">
    <div class="stat-item stat-item--up" data-filter-trigger="up" role="button" tabindex="0">
      <span class="stat-item__value mono" id="stat-up-val">{{.UpCount}}</span>
      <span class="stat-item__label">{{.T.StatUp}}</span>
    </div>

    <div class="stat-item stat-item--degraded" data-filter-trigger="degraded" role="button" tabindex="0">
      <span class="stat-item__value mono" id="stat-degraded-val">{{.DegradedCount}}</span>
      <span class="stat-item__label">{{.T.StatDegraded}}</span>
    </div>

    <div class="stat-item stat-item--down" data-filter-trigger="down" role="button" tabindex="0">
      <span class="stat-item__value mono" id="stat-down-val">{{.DownCount}}</span>
      <span class="stat-item__label">{{.T.StatDown}}</span>
    </div>

    <div class="stat-item stat-item--total" data-filter-trigger="all" role="button" tabindex="0">
      <span class="stat-item__value mono" id="stat-total-val">{{.Total}}</span>
      <span class="stat-item__label">{{.T.StatTotal}}</span>
    </div>
  </div>

  <div class="stats-meta">
    <span>{{.T.LastCycle}}: <strong class="mono">{{.LastCheckFormatted}}</strong></span>
    <span>{{.T.ArgusUptime}}: <strong class="mono">{{.UptimeDurationFormatted}}</strong></span>
  </div>
</div>
