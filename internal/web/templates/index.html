{{define "content"}}
<div id="stats-container">
  {{.StatsHTML}}
</div>

<main class="main-container">
  <div class="cards-grid" id="cards-grid">
    {{.CardsHTML}}
  </div>
  <div id="empty-filter-state" class="empty-filter-state" hidden>
    <p>{{.T.EmptyFilterTitle}}</p>
    <button type="button" id="clear-filters-btn" class="period-btn active">{{.T.ClearFilters}}</button>
  </div>
</main>
{{end}}
