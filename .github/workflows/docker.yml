name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual para a imagem Docker (ex: v1.0.0; deixe vazio para auto-semver)'
        required: false
        default: ''
        type: string
      latest:
        description: 'Atualizar também a tag latest?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gofmt, go vet and tests
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -race -count=1 ./...

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Auto Bump Version and Push Tag
        id: auto_tag
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.tag == '')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*.*.*" 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          git tag -a "$NEW_TAG" -m "chore(release): $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'winajr' }}/argus
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.latest == true) }}
            type=raw,value=${{ steps.auto_tag.outputs.new_tag }},enable=${{ steps.auto_tag.outputs.new_tag != '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.auto_tag.outputs.new_tag || inputs.tag || steps.meta.outputs.version || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub Overview
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.latest == true)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKERHUB_USER="${DOCKERHUB_USERNAME:-winajr}"
          AUTH_HEADER=""
          LOGIN_PAYLOAD=$(jq -n --arg u "$DOCKERHUB_USER" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}')
          JWT_TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_PAYLOAD" 2>/dev/null | jq -r '.token // empty' || true)
          if [ -n "$JWT_TOKEN" ]; then
            AUTH_HEADER="Authorization: JWT $JWT_TOKEN"
          else
            PAT_PAYLOAD=$(jq -n --arg id "$DOCKERHUB_USER" --arg sec "$DOCKERHUB_TOKEN" '{identifier: $id, secret: $sec}')
            ACCESS_TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/auth/token" \
              -H "Content-Type: application/json" \
              -d "$PAT_PAYLOAD" 2>/dev/null | jq -r '.access_token // .token // empty' || true)
            if [ -n "$ACCESS_TOKEN" ]; then
              AUTH_HEADER="Authorization: Bearer $ACCESS_TOKEN"
            fi
          fi
          if [ -z "$AUTH_HEADER" ]; then
            echo "::warning::Could not obtain Docker Hub API token to update repository overview."
            exit 0
          fi
          BODY=$(jq -n \
            --arg desc "Lightweight, resilient system availability and NOC monitor with root-cause diagnosis." \
            --rawfile full .github/DOCKERHUB.md \
            '{description: $desc, full_description: $full}')
          HTTP_CODE=$(curl -sS -o /tmp/dh_resp.json -w "%{http_code}" \
            -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/argus/" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Docker Hub overview update returned HTTP $HTTP_CODE: $(cat /tmp/dh_resp.json)"
          else
            echo "Docker Hub overview updated successfully (HTTP $HTTP_CODE)."
          fi
