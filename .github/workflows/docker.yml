name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual para a imagem Docker (ex: 1.0.0; deixe vazio para auto-semver)'
        required: false
        default: ''
        type: string
      latest:
        description: 'Atualizar também a tag latest?'
        required: true
        default: true
        type: boolean
      prune_tags:
        description: 'Remover todas as tags antigas do Docker Hub exceto latest?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prune:
    name: Prune Docker Hub Tags
    if: github.event_name == 'workflow_dispatch' && inputs.prune_tags == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-latest tags from Docker Hub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          DOCKERHUB_USER="${DOCKERHUB_USERNAME:-winajr}"
          LOGIN_PAYLOAD=$(jq -n --arg u "$DOCKERHUB_USER" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}')
          JWT_TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_PAYLOAD" 2>/dev/null | jq -r '.token // empty' || true)
          if [ -z "$JWT_TOKEN" ]; then
            echo "::error::Failed to obtain Docker Hub JWT token."
            exit 1
          fi
          TAGS=$(curl -fsSL "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/argus/tags?page_size=100" \
            -H "Authorization: JWT $JWT_TOKEN" | jq -r '.results[].name')
          for TAG_NAME in $TAGS; do
            if [ "$TAG_NAME" = "latest" ]; then
              continue
            fi
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/argus/tags/${TAG_NAME}/" \
              -H "Authorization: JWT $JWT_TOKEN")
            echo "Deleted Docker Hub tag ${TAG_NAME} (HTTP ${CODE})"
          done

  test:
    name: Verify & Test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prune_tags == true && inputs.latest == false && inputs.tag == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gofmt, go vet and tests
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi
          go vet ./...
          go test -race -count=1 ./...

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine SemVer Bump and Push Tag
        id: auto_tag
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${MANUAL_TAG:-}" ]; then
            CLEAN_MANUAL="${MANUAL_TAG#v}"
            echo "new_tag=$CLEAN_MANUAL" >> "$GITHUB_OUTPUT"
            echo "effective_version=$CLEAN_MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_TAG=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$HEAD_TAG" ]; then
            echo "HEAD already tagged as $HEAD_TAG; skipping auto-tag."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "effective_version=$HEAD_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            VERSION="0.0.0"
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              RANGE="${BEFORE_SHA}..HEAD"
            else
              RANGE="HEAD~1..HEAD"
            fi
          else
            VERSION="${LATEST_TAG#v}"
            RANGE="${LATEST_TAG}..HEAD"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP_LEVEL=0
          while IFS= read -r SHA; do
            if [ -z "$SHA" ]; then
              continue
            fi
            SUBJECT=$(git log -1 --format=%s "$SHA")
            BODY=$(git log -1 --format=%b "$SHA")

            if echo "$SUBJECT" | grep -Eq '^[a-zA-Z]+(\([^)]+\))?!:' || echo "$BODY" | grep -Eq '^BREAKING[ -]CHANGE:'; then
              BUMP_LEVEL=3
              break
            elif echo "$SUBJECT" | grep -Eiq '^feat(\([^)]+\))?:'; then
              if [ "$BUMP_LEVEL" -lt 2 ]; then
                BUMP_LEVEL=2
              fi
            elif echo "$SUBJECT" | grep -Eiq '^(fix|perf|refactor|revert|build|bugfix|hotfix|security)(\([^)]+\))?:'; then
              if [ "$BUMP_LEVEL" -lt 1 ]; then
                BUMP_LEVEL=1
              fi
            fi
          done < <(git rev-list "$RANGE")

          if [ "$BUMP_LEVEL" -eq 0 ]; then
            echo "No release-worthy commits since ${LATEST_TAG:-initial commit}; skipping new tag."
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            echo "effective_version=${LATEST_TAG:-dev}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$BUMP_LEVEL" in
            3)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            2)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            1)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${LATEST_TAG:-0.0.0} -> $NEW_TAG (level=$BUMP_LEVEL)"
          git tag -a "$NEW_TAG" -m "chore(release): $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "effective_version=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'winajr' }}/argus
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && inputs.latest == true) }}
            type=raw,value=${{ steps.auto_tag.outputs.new_tag }},enable=${{ steps.auto_tag.outputs.new_tag != '' }}
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.auto_tag.outputs.effective_version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub Overview
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.latest == true)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKERHUB_USER="${DOCKERHUB_USERNAME:-winajr}"
          AUTH_HEADER=""
          LOGIN_PAYLOAD=$(jq -n --arg u "$DOCKERHUB_USER" --arg p "$DOCKERHUB_TOKEN" '{username: $u, password: $p}')
          JWT_TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "$LOGIN_PAYLOAD" 2>/dev/null | jq -r '.token // empty' || true)
          if [ -n "$JWT_TOKEN" ]; then
            AUTH_HEADER="Authorization: JWT $JWT_TOKEN"
          else
            PAT_PAYLOAD=$(jq -n --arg id "$DOCKERHUB_USER" --arg sec "$DOCKERHUB_TOKEN" '{identifier: $id, secret: $sec}')
            ACCESS_TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/auth/token" \
              -H "Content-Type: application/json" \
              -d "$PAT_PAYLOAD" 2>/dev/null | jq -r '.access_token // .token // empty' || true)
            if [ -n "$ACCESS_TOKEN" ]; then
              AUTH_HEADER="Authorization: Bearer $ACCESS_TOKEN"
            fi
          fi
          if [ -z "$AUTH_HEADER" ]; then
            echo "::warning::Could not obtain Docker Hub API token to update repository overview."
            exit 0
          fi
          BODY=$(jq -n \
            --arg desc "Lightweight, resilient system availability and NOC monitor with root-cause diagnosis." \
            --rawfile full .github/DOCKERHUB.md \
            '{description: $desc, full_description: $full}')
          HTTP_CODE=$(curl -sS -o /tmp/dh_resp.json -w "%{http_code}" \
            -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USER}/argus/" \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Docker Hub overview update returned HTTP $HTTP_CODE: $(cat /tmp/dh_resp.json)"
          else
            echo "Docker Hub overview updated successfully (HTTP $HTTP_CODE)."
          fi
